<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f3ee" />
  <title>Archive</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Archive 홈">
        <span class="brand-mark">A</span>
        <span class="brand-text">Archive</span>
      </a>
      <button id="refreshButton" class="ghost-button" type="button">새로고침</button>
    </header>

    <main>
      <section class="hero hero-settings-pending" id="heroSection">
        <p id="heroEyebrow" class="eyebrow">GOOGLE DRIVE ARCHIVE</p>
        <h1 id="heroTitle">내 콘텐츠를<br />한곳에서 찾아보세요.</h1>
        <p id="heroSubtitle" class="hero-copy">
          인물조합과 분량으로 분류하고, 제목이나 작성자로 빠르게 검색할 수 있습니다.
        </p>

        <div class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="제목 또는 작성자 검색" autocomplete="off" />
          <button id="clearSearch" class="clear-search" type="button" aria-label="검색어 지우기">×</button>
        </div>
      </section>

      <section class="controls" aria-label="콘텐츠 필터">
        <div class="controls-grid">
          <div class="control-card control-card-wide">
            <span class="filter-label">인물조합</span>
            <div id="combinationFilters" class="chips"></div>
          </div>

          <div class="control-card">
            <span class="filter-label">분량</span>
            <div id="lengthFilters" class="chips">
              <button class="chip active" type="button" data-length="전체">전체</button>
              <button class="chip" type="button" data-length="단편">단편</button>
              <button class="chip" type="button" data-length="장편">장편</button>
            </div>
          </div>

          <div class="control-card">
            <span class="filter-label">보기 방식</span>
            <div class="view-switch">
              <button id="listViewButton" class="view-button active" type="button">☰ 리스트형</button>
              <button id="cardViewButton" class="view-button" type="button">▦ 카드형</button>
            </div>
          </div>
        </div>
      </section>

      <section class="content-section">
        <div class="section-head">
          <div>
            <p class="section-kicker">CONTENTS</p>
            <h2>콘텐츠</h2>
          </div>
          <p id="resultCount" class="result-count">불러오는 중…</p>
        </div>

        <div id="status" class="status-card">
          <div class="spinner" aria-hidden="true"></div>
          <p>저장된 콘텐츠 목록을 불러오고 있어요.</p>
        </div>

        <div id="contentGrid" class="content-grid" hidden></div>

        <div id="contentListWrap" class="content-list-wrap" hidden>
          <table class="content-list">
            <thead>
              <tr>
                <th>인물조합</th>
                <th>구분</th>
                <th>제목</th>
                <th>작성자</th>
              </tr>
            </thead>
            <tbody id="contentListBody"></tbody>
          </table>
        </div>

        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-symbol">⌕</div>
          <h3>검색 결과가 없습니다.</h3>
          <p>검색어나 필터를 바꿔보세요.</p>
        </div>
      </section>
    </main>
  </div>

  <div id="readerOverlay" class="reader-overlay" hidden>
    <article class="reader" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
      <header class="reader-header">
        <div class="reader-meta-top">
          <span id="readerCombination" class="reader-tag"></span>
          <span id="readerLength" class="reader-tag subtle"></span>
        </div>
        <button id="closeReader" class="reader-close" type="button" aria-label="본문 닫기">×</button>
        <h2 id="readerTitle"></h2>
        <p id="readerAuthor" class="reader-author"></p>
        <p id="readerFileName" class="reader-filename"></p>
      </header>
      <div id="readerBody" class="reader-body">
        <div class="reader-loading">
          <div class="spinner" aria-hidden="true"></div>
          <p>본문을 불러오는 중…</p>
        </div>
      </div>

      <button id="readerScrollTop" class="reader-scroll-top" type="button" aria-label="본문 맨 위로 이동" title="맨 위로">
        ↑
      </button>
    </article>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
