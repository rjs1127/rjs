<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>셩냥책 · 공동 재검수</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#22332b}main{max-width:1040px;margin:auto;padding:24px 16px 80px}.card{background:#fff;border:1px solid #dce4df;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 3px 18px #00000008}h1{font-size:24px}h2{font-size:20px}p{line-height:1.6}input,textarea,select,button{font:inherit}input,textarea,select{padding:12px;border:1px solid #b8c9bf;border-radius:9px;background:white;color:#1f2a24;max-width:100%}input[type=password],input[type=search]{width:100%}textarea{width:100%;min-height:115px;resize:vertical;line-height:1.6}button{padding:10px 14px;background:#2d6748;color:#fff;border:0;border-radius:9px;cursor:pointer}button.secondary{background:#e6eee8;color:#1c4530}button:disabled{opacity:.5;cursor:default}.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.muted{color:#60756a;font-size:13px}.row{border-top:1px solid #e3e9e5;padding:12px 2px}.row button{margin-left:12px}.review-tabs{margin-bottom:14px;scroll-margin-top:16px}.same-value{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#356b4e;background:#e5f1e8;border-radius:5px;padding:2px 6px}.review-tabs button[aria-selected="true"]{background:#2d6748;color:white}.synopsis-rework{border-top:1px solid #e3e9e5;margin-top:14px;padding-top:12px}.synopsis-rework textarea{min-height:70px}.row .muted{line-height:1.6}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{border:1px solid #e1e6e2;border-radius:12px;padding:12px;margin:14px 0}.value{white-space:pre-wrap;overflow-wrap:anywhere;max-height:230px;overflow:auto;background:#f6f8f6;border-radius:8px;padding:10px;line-height:1.55}label{display:block;margin:7px 0;font-weight:650}#status{white-space:pre-wrap}#login{max-width:440px;margin:10vh auto}#review{display:none}@media(max-width:650px){.cols{grid-template-columns:1fr}.card{padding:14px}.bar button{flex:1}}@media(prefers-color </style></head><body><main><section id="login" class="card"><h1>공동 작품 재검수</h1><p>관리자에게 받은 전용 암호로 배정된 작품만 검수할 수 있어요. 다른 관리자 기능은 제공되지 않습니다.</p><form id="entry"><label for="pin">재검수 전용 암호</label><input id="pin" type="password" autocomplete="off" maxlength="64" required><button type="submit" style="margin-top:12px">검수 시작</button></form></section><section id="review"><header class="bar"><h1>내 담당 재검수</h1><button id="refresh" class="secondary">새로고침</button><button id="logout" class="secondary">종료</button></header><p class="muted">선택한 값만 비공개 초안에 병합한 뒤, 승인할 항목을 공개 도감에 반영할 수 있습니다. 다른 사람의 변경이 있으면 재조회가 필요해요.</p><div class="card"><div class="bar review-tabs" role="tablist" aria-label="재검수 단계"><button id="tabWork" class="secondary" role="tab" aria-selected="true">작업 중</button><button id="tabApprove" class="secondary" role="tab" aria-selected="false">작업 완료 · 승인 대기</button></div><input id="search" type="search" placeholder="작품명·작가 검색"><p id="counter" class="muted"></p><div id="listing"></div></div><div id="editor" class="card" hidden></div></section><p id="status" role="status" aria-live="polite" class="muted"></p></main><script src="/catalog-review.js?v=1108" defer></script></body></html>
